name: Taste Engine branch snapshot

on:
  push:
    branches:
      - feature/taste-engine-v05
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: taste-engine-branch-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1
