name: Hallmark branch snapshot

on:
  push:
    branches:
      - feature/hallmark-design-intelligence-v04
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: hallmark-branch-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1
