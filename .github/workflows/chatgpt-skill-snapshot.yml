name: ChatGPT skill branch snapshot

on:
  push:
    branches:
      - feature/chatgpt-skill-v041
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source tree
        run: tar --exclude=.git --exclude=repo-source.tar.gz -czf repo-source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-skill-base-snapshot
          path: repo-source.tar.gz
          retention-days: 1
