name: Apply Taste Engine release payload

on:
  push:
    branches:
      - release/taste-engine-v0.4.0
    paths:
      - .taste-payload/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify and apply source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .taste-payload/part-* | base64 --decode > /tmp/appblocks-changes.patch.xz
          echo "$(cat .taste-payload/SHA256)  /tmp/appblocks-changes.patch.xz" | sha256sum -c -
          xz --decompress --stdout /tmp/appblocks-changes.patch.xz > /tmp/appblocks-changes.patch
          git apply --index --binary /tmp/appblocks-changes.patch
          git restore --source=HEAD --staged --worktree -- \
            .github/workflows/ci.yml \
            .github/workflows/generation2.yml \
            .github/workflows/pages.yml \
            .github/workflows/release.yml \
            .github/workflows/hallmark-snapshot.yml
          rm -rf .taste-payload
      - name: Verify release tree
        run: npm run verify
      - name: Remove generated verification output
        shell: bash
        run: |
          rm -rf public .appblocks-generation2 .appblocks-motion .appblocks-taste .verification .verification-final
      - name: Commit verified release source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release AppBlocks Web 0.4 Taste Engine 5"
          git push origin "HEAD:${GITHUB_REF_NAME}"
