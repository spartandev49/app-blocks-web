name: Deploy showcase to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build Motion Engine 3 showcase
        run: node bin/appblocks-v2.js build examples/motion-showcase.ab --out public --base /app-blocks-web/ --strict
      - name: Preserve Generation 2 showcase
        run: node bin/appblocks-v2.js build examples/generation2-showcase.ab --out public/v2 --base /app-blocks-web/v2/ --strict
      - name: Build documentation showcase
        run: node bin/appblocks.js build examples/showcase.appblocks --out public/docs --base /app-blocks-web/docs/ --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
