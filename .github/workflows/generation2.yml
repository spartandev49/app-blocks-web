name: Generation 2, Motion 3, and Taste 5

on:
  pull_request:
  push:
    branches:
      - feature/motion-engine-v03
      - feature/taste-engine-v05
      - feature/taste-engine-million-site-v05
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Environment
        run: |
          node --version
          npm --version
      - name: Syntax
        run: npm run check
      - name: Generation 2, Motion 3, and Taste 5 tests
        run: |
          node --test \
            test/generation2.test.js \
            test/generation2-token-budget.test.js \
            test/generation2-cli.test.js \
            test/motion3.test.js \
            test/taste5.test.js \
            test/taste5-cli.test.js
      - name: Release tests
        run: |
          set -o pipefail
          node --test test/generation2-release.test.js test/taste5-release.test.js 2>&1 | tee release-tests-node-${{ matrix.node }}.log
      - name: Complete test suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee full-tests-node-${{ matrix.node }}.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taste5-test-logs-node-${{ matrix.node }}
          path: |
            release-tests-node-${{ matrix.node }}.log
            full-tests-node-${{ matrix.node }}.log
          if-no-files-found: ignore
      - name: Strict Generation 2 build
        run: node bin/appblocks-v2.js build examples/generation2-showcase.ab --out .verification/generation2 --strict
      - name: Strict Motion Engine 3 build
        run: node bin/appblocks-v2.js build examples/motion-showcase.ab --out .verification/motion --strict
      - name: Strict Taste Engine 5 build
        run: node bin/appblocks-v2.js build examples/taste-showcase.ab --out .verification/taste --strict --taste-strict
      - name: Generated-output and Taste audits
        run: npm run audit && npm run audit:taste
      - name: Benchmark
        run: npm run benchmark
      - name: Package inspection
        run: npm pack --dry-run --ignore-scripts
