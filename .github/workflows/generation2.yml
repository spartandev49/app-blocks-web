name: Generation 2

on:
  pull_request:
  push:
    branches:
      - feature/maximal-combinatorial-library-v4
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Environment
        run: |
          node --version
          npm --version
      - name: Syntax
        run: |
          node --check bin/appblocks-v2.js
          node --check src/generation2.js
          node --check src/normalizer-v2.js
          node --check src/generation2-assets.js
          node --check src/compiler-v2.js
          node --check src/compiler-v3.js
          node --check src/parser-v2.js
      - name: Generation 2 tests
        run: node --test test/generation2.test.js test/generation2-token-budget.test.js test/generation2-cli.test.js
      - name: Release tests
        run: |
          set -o pipefail
          node --test test/generation2-release.test.js 2>&1 | tee release-tests-node-${{ matrix.node }}.log
      - name: Existing test suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee full-tests-node-${{ matrix.node }}.log
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generation2-test-logs-node-${{ matrix.node }}
          path: |
            release-tests-node-${{ matrix.node }}.log
            full-tests-node-${{ matrix.node }}.log
          if-no-files-found: ignore
      - name: Generated-output audit
        run: npm run --if-present audit
      - name: Benchmark
        run: npm run --if-present benchmark
      - name: Package inspection
        run: npm pack --dry-run
