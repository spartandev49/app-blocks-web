name: Layout fix branch snapshot

on:
  push:
    branches:
      - fix/layout-resilience-v0.4.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload repository snapshot
        uses: actions/upload-artifact@v4
        with:
          name: layout-fix-branch-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1
