name: Publish AppBlocks Web layout resilience fix

on:
  push:
    branches:
      - fix/layout-resilience-v0.4.1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appblocks-layout-resilience-publish
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/layout-resilience-v0.4.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply systemic AppBlocks layout fixes
        run: python scripts/apply-layout-resilience-hotfix.py
      - name: Verify source, generated output, Taste quality, and responsive geometry
        run: npm run verify
      - name: Inspect publishable package
        run: npm pack --dry-run --ignore-scripts
      - name: Remove generated verification output
        shell: bash
        run: |
          rm -rf public .appblocks-generation2 .appblocks-motion .appblocks-taste .verification .verification-final
          rm -f app-blocks-web-*.tgz
      - name: Publish verified clean commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -f scripts/apply-layout-resilience-hotfix.py
          git checkout origin/main -- .github/workflows
          rm -f .github/workflows/layout-fix-snapshot.yml
          git add -A
          git diff --cached --check
          tree="$(git write-tree)"
          parent="$(git rev-parse origin/main)"
          commit="$(printf '%s\n\n%s\n' \
            'Publish AppBlocks Web 0.4.1 layout resilience fixes' \
            'Enforce component-compatible layouts, intrinsic responsive geometry, safe typography, balanced metrics, resilient footers and application shells, and browser-level regression auditing.' \
            | git commit-tree "$tree" -p "$parent")"
          git push origin "$commit:refs/heads/main"
          echo "Published commit $commit to main" >> "$GITHUB_STEP_SUMMARY"
