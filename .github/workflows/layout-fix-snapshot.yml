name: Publish AppBlocks Web 0.4.1 layout resilience fix

on:
  push:
    branches:
      - fix/layout-resilience-v0.4.1
    paths:
      - .layout-payload/READY
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appblocks-layout-resilience-publish
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/layout-resilience-v0.4.1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconstruct and verify the source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .layout-payload/part-* | base64 --decode > /tmp/appblocks-v0.4.1.patch.xz
          echo "$(cat .layout-payload/SHA256)  /tmp/appblocks-v0.4.1.patch.xz" | sha256sum -c -
          xz --decompress --stdout /tmp/appblocks-v0.4.1.patch.xz > /tmp/appblocks-v0.4.1.patch
      - name: Apply systemic fixes to the current main tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B appblocks-v0.4.1-publish origin/main
          git apply --index --binary /tmp/appblocks-v0.4.1.patch
          git diff --cached --check
      - name: Verify source, generated output, Taste quality, and layout contracts
        run: npm run verify
      - name: Inspect publishable package
        run: npm pack --dry-run --ignore-scripts
      - name: Remove generated verification output
        shell: bash
        run: |
          rm -rf public .appblocks-generation2 .appblocks-motion .appblocks-taste .verification .verification-final
          rm -f app-blocks-web-*.tgz
      - name: Publish verified commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish AppBlocks Web 0.4.1 layout resilience fixes"
          git push origin HEAD:main
